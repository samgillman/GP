name: Validate GP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gp-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned application dependencies
        run: |
          python -m pip install -r requirements.lock
          npm --prefix web ci --no-audit --no-fund
      - name: Requirements, scientific regressions and workbook tests
        run: |
          python scripts/check_requirements.py
          python -m pytest -q
          npm --prefix web test
      - name: Build server and self-contained browser applications
        run: |
          npm --prefix web run build
          npm --prefix web run build:static
          python scripts/build_browser.py
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Exercise actual browser calculations and import diagnostics
        env:
          GP_SCREENSHOTS: test-results/desktop
          GP_GRID_EVIDENCE: test-results/grid
          GP_BROWSER_EVIDENCE: test-results/large-workbook.json
        run: |
          python -m http.server 8001 --bind 127.0.0.1 --directory web/dist-static > /tmp/gp-static.log 2>&1 &
          static_pid=$!
          python -m uvicorn gp.server:app --host 127.0.0.1 --port 8002 > /tmp/gp-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$static_pid" "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for port in (8001, 8002):
              for attempt in range(60):
                  try:
                      urllib.request.urlopen(f'http://127.0.0.1:{port}', timeout=1).close()
                      break
                  except OSError:
                      if attempt == 59:
                          raise
                      time.sleep(.5)
          PY
          python scripts/check_recalculation.py http://127.0.0.1:8002
          python scripts/check_recalculation.py http://127.0.0.1:8001
          python scripts/check_import_diagnostics.py http://127.0.0.1:8001
          python scripts/check_desktop_ui.py http://127.0.0.1:8001
          python scripts/check_grid_ui.py http://127.0.0.1:8001
          python scripts/check_graph_zoom.py http://127.0.0.1:8001
          GP_AXES_EVIDENCE=test-results/axes-static python scripts/check_axes.py http://127.0.0.1:8001
          GP_AXES_EVIDENCE=test-results/axes-server python scripts/check_axes.py http://127.0.0.1:8002
          GP_AXIS_LAYOUT_EVIDENCE=test-results/axis-layout-static python scripts/check_axis_layout.py http://127.0.0.1:8001
          GP_AXIS_LAYOUT_EVIDENCE=test-results/axis-layout-server python scripts/check_axis_layout.py http://127.0.0.1:8002
          GP_DATASET_ORDER_EVIDENCE=test-results/dataset-order-static python scripts/check_dataset_order.py http://127.0.0.1:8001
          GP_DATASET_ORDER_EVIDENCE=test-results/dataset-order-server python scripts/check_dataset_order.py http://127.0.0.1:8002
          python scripts/check_xy_gaps.py http://127.0.0.1:8001
          python scripts/check_xy_gaps.py http://127.0.0.1:8002
          GP_EXCLUSIONS_EVIDENCE=test-results/exclusions-static.json python scripts/check_exclusions.py http://127.0.0.1:8001
          GP_EXCLUSIONS_EVIDENCE=test-results/exclusions-server.json python scripts/check_exclusions.py http://127.0.0.1:8002
          GP_FOUNDATIONS_EVIDENCE=test-results/foundations-server python scripts/check_workbook_foundations.py http://127.0.0.1:8002
          GP_FOUNDATIONS_EVIDENCE=test-results/foundations-static python scripts/check_workbook_foundations.py http://127.0.0.1:8001
          GP_COLUMN_EVIDENCE=test-results/column-static.json python scripts/check_column_analysis.py http://127.0.0.1:8001
          GP_COLUMN_EVIDENCE=test-results/column-server.json python scripts/check_column_analysis.py http://127.0.0.1:8002
          python scripts/check_large_workbook.py http://127.0.0.1:8002
          python scripts/check_column_datasets.py http://127.0.0.1:8001
          python scripts/check_column_datasets.py http://127.0.0.1:8002
          python scripts/check_column_spacing.py http://127.0.0.1:8001
          python scripts/check_column_spacing.py http://127.0.0.1:8002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            /tmp/gp-static.log
            /tmp/gp-server.log
          if-no-files-found: ignore
